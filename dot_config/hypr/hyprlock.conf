general {
    disable_loading_bar = true
    hide_cursor = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
    blur_size = 2
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(ffffffff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 18
    position = 0, -120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    position = 0, -220
    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgba(ffffff66)
    inner_color = rgba(00000088)
    font_color = rgba(ffffffff)

    check_color = rgba(00ff99ff)
    fail_color = rgba(ff5555ff)

    rounding = 18
    fade_on_empty = false
    placeholder_text = Password...
    dots_center = true
}
