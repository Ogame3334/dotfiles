## prefixキーの変更

# prefixキーをC-aに変更する
set -g prefix C-j

# デフォルトのprefixキーC-bを解除する
unbind C-b

set -g status-interval 1

## ペインのキーバインド

bind C-i split-window -h
bind C-k split-window -v

# ペインの移動
bind C-j select-pane -t :.+

# ペインを最大化
bind C-z resize-pane -Z
bind -n C-z resize-pane -Z

# ペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind -n C-h
unbind -n C-k
unbind -n C-l
unbind x

bind C-q copy-mode

# ウィンドウを切り替える
bind C-c new-window
bind C-p previous-window
bind C-n next-window
bind C-l last-window
bind C-w choose-window

## ステータスラインの見た目の変更

# 256色モードを有効にする
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの色を変更
setw -g status-style fg=white,bg=black

# set -g status-left "#[fg=green,bold]#{?client_prefix,#[fg=colour3],} [#I #W] "
set -g status-left ""
set -g status-left-length 0

set -g status-right '#(clipboard=$(~/tmux/show_clipboard); touchpad=$(/home/ogame0522/tmux/get_touchpad) net=$(/home/ogame0522/tmux/get_net); cpu_mem=$(/home/ogame0522/tmux/get_cpu_mem) battery_per=$(/home/ogame0522/tmux/get_battery); vol=$(/home/ogame0522/tmux/get_volume); label=$(date "+%m/%d(%a) %H:%M"); echo "#[fg=white]  #[bg=colour232,fg=dimgray]$clipboard#[bg=default,fg=white] | $touchpad | $cpu_mem | $net | $vol | $battery_per |  $label ")'
set -g status-right-length 130
# window-statusを中央寄せにする
set -g status-justify left

# window-statusの見た目を変更
# setw -g window-status-format ''
setw -g window-status-current-format "#[fg=green,bold,bg=colour234]#{?client_prefix,#[fg=colour3],} #I #W "
setw -g window-status-format ' #I #W '

# windowのインデックスを0から始める
set -g base-index 0

## その他

set -g pane-border-style fg=colour240,bg=colour236
set -g pane-active-border-style fg=green,bg=colour234

set -g window-style 'fg=default,bg=colour236'
set -g window-active-style 'fg=default,bg=colour234'

# マウス操作を有効にする
set-option -g mouse on
set -g mode-keys vi

# prefix+r で設定のリロード
bind C-r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key C-x kill-pane

set -g pane-border-status bottom

set -g pane-border-format " #[bg=red,fg=black]#{?window_zoomed_flag, 󰊓 ,}#[bg=green,fg=black] #{pane_current_command} #(/home/ogame0522/tmux/get_branch #{pane_current_path})#[bg=default,fg=green] #{pane_current_path} "
